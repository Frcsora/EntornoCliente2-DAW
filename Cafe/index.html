<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cafe</title>
    <style>
        body {
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
            background-image: url(cafe-en-grano.webp);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .cafes{
            font-size: 50px;
            color: white;
        }
        .table{
            width: 90vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border-radius: 10px;
            grid-gap: 2vw;
        }
        .tarjeta{
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            background-color: darkgrey;
            padding: 1vw;
        }
        img{
            width: 25vw;
            height: 35vh;
        }
    </style>
</head>
<body>

    <script src="index.js"></script>
</body>
</html>

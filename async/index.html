<!doctype html>
<html lang="en">
<style>
    body{
        overflow-x: hidden;
        width:100vw;
        min-height:100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    img{
        width:80%;
    }
    .tarjetas{
        width: 90vw;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        height: 100%;
        gap:5%;
        justify-content: center;
    }
    .tarjeta{
        width: 100%;
        display: flex;
        flex-direction: column;
        border: 1px solid black;
        text-align: center;
        justify-content: space-between;
        align-items: center;
    }
    .hidden{
        display: none;
    }
</style>

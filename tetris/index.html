<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Personalizado</title>
    <style>

        body{
            background-image: url(prado-1.webp);
            background-size: cover;
            background-position:center ;
            background-repeat: no-repeat;

        }
        canvas{
            display: block;
            margin: 0 auto;
            background: #000;
        }
        #puntuacion{
            background-color: black;
            color:white;
            text-align: center;
        }
        div{
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 9vh;
            align-items: center;
            gap:5%;
        }

        #musica{
            width: 3%;
        }
        svg{
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1 id="puntuacion"></h1>
    <canvas id="siguiente" width="90" height="90"></canvas><br> 
    <canvas id="tetris" width="300" height="600"></canvas>
    <div>
        <button id="pausa">Pausa</button>
        <button id="musica"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><!--!Font Awesome Free 6.7.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.--><path d="M301.1 34.8C312.6 40 320 51.4 320 64l0 384c0 12.6-7.4 24-18.9 29.2s-25 3.1-34.4-5.3L131.8 352 64 352c-35.3 0-64-28.7-64-64l0-64c0-35.3 28.7-64 64-64l67.8 0L266.7 40.1c9.4-8.4 22.9-10.4 34.4-5.3zM425 167l55 55 55-55c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-55 55 55 55c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-55-55-55 55c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l55-55-55-55c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0z"/></svg></button>
        <button id="instrucciones">Instrucciones</button>
    </div>

    <h1 id="mensaje-final"></h1>
    <audio id="audio" src="tetris.mp3" autoplay loop></audio>
    <script src="tetris.js"></script>
</body>
</html>

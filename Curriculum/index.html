<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header{
            display: grid;
            grid-template-columns: 20% 80%;
            background-color: #00ffbb;

        }
        main{
            display: grid;
            grid-template-columns: 20% 80%;
            grid-template-rows: auto;
        }
        .mainSidebar{
            padding: 1vw;
            display:flex;
            gap: 1vw;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }
        .maincontact a:hover{
            cursor: pointer;
        }
        .sidebar{
            grid-column: 1/ span 1;
            grid-row: 1/ span 1;
            background-color: #DDDDDD;
            display: flex;
            flex-direction: column;
        }

        .maincontent{
            grid-column: 2/ span 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #aaaaff;
        }

        .mainContentDiv{
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 50%;
        }
        .studiesDiv, .workDiv{
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        hr{
            width: 100%;
        }
        img{
            width: 60%;
            height: 100%;
        }
        .headerimg{
            padding: 0.2vw;
            grid-column: 1 / span 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .headertext{
            grid-column: 2 / span 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <script src="index.js"></script>
</body>
</html>
